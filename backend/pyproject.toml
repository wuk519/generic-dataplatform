[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataplatform-backend"
description = "Backend for the Generic Data Platform — a simple Splunk-like ingest+query service."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Generic Data Platform" }]
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "PyJWT>=2.10",
    "bcrypt>=4.2",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

# Single source of truth for the version: backend/app/__init__.py
[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"
